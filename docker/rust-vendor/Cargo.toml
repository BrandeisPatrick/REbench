[package]
name = "vendor-seed"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
quick-xml = "0.37"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
hashbrown = "0.15"
ahash = "0.8"
smallvec = "1"
memchr = "2"
itoa = "1"
ryu = "1"
mimalloc = { version = "0.1", default-features = false }
