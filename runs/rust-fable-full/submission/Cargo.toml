[package]
name = "calc"
version = "0.1.0"
edition = "2021"

[dependencies]
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
